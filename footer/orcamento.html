<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Solicite um Orçamento | Rede Licitações</title>
  <link rel="icon" type="image/png" href="../img/logoEmpresas/rede (3).png">
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="orcamento.css" />
</head>
<body>

  <div data-include="../header.html"></div>

  <main class="container">
    <h1>Solicite um Orçamento</h1>
    <p>Preencha o formulário abaixo para que possamos entender suas necessidades e enviar uma proposta personalizada.</p>

    <form class="orcamento-form" action="https://formsubmit.co/redelicitacaoja@gmail.com" method="POST">
      <input type="text" name="_honey" style="display:none">
      <input type="hidden" name="_captcha" value="false">
      <label for="nome">Nome completo *</label>
      <input type="text" id="nome" name="nome" required>

      <label for="empresa">Empresa</label>
      <input type="text" id="empresa" name="empresa">

      <label for="email">E-mail *</label>
      <input type="email" id="email" name="email" required>

      <label for="telefone">Telefone / WhatsApp *</label>
      <input type="tel" id="telefone" name="telefone" required>

      <label for="interesse">Como podemos ajudar?</label>
      <select id="interesse" name="interesse">
        <option value="">Selecione...</option>
        <option value="assessoria">Assessoria para Licitações</option>
        <option value="analise">Análise de Editais</option>
        <option value="cadastro">Cadastro em Portais</option>
        <option value="outros">Outros</option>
      </select>

      <label for="mensagem">Mensagem adicional</label>
      <textarea id="mensagem" name="mensagem" rows="5"></textarea>

      <button type="submit">Enviar Solicitação</button>
    </form>
  </main>

  <div data-include="../footer.html"></div>
    <script src="../include.js"></script>

</body>
</html>
