<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Rede Licitações</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="contato.css" />
    <link rel="icon" type="image/png" href="img/logoEmpresas/rede (3).png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

  <div data-include="header.html"></div>
      
      <div class="container">
        <h2>Entre em Contato</h2>
        <form action="https://formsubmit.co/redelicitacaoja@gmail.com" method="post">
          <input type="text" name="_honey" style="display:none">
          <input type="hidden" name="_captcha" value="false">
          <label for="nome">Nome:</label>
          <input type="text" id="nome" name="nome" required>
    
          <label for="email">E-mail:</label>
          <input type="email" id="email" name="email" required>
    
          <label for="assunto">Assunto:</label>
          <input type="text" id="assunto" name="assunto" required>
    
          <label for="mensagem">Mensagem:</label>
          <textarea id="mensagem" name="mensagem" rows="5"></textarea>
    
          <button type="submit">Enviar Mensagem</button>
        </form>
    
        <div class="contato-info">
          <h3>Informações de Contato</h3>
          <p><strong>Email:</strong> redelicitacaopj@gmail.com</p>
          <p><strong>Telefone:</strong> (83) 90000-0000</p>
          
          
    
          <a class="whatsapp-button" href="https://wa.me/5583988613922" target="_blank">
            Fale conosco no WhatsApp
          </a>
        </div>
      </div>
    
      <div data-include="footer.html"></div>
        <script src="include.js"></script>

</body>
</html>
